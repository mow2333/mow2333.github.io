<style>
  :root {
    --bg: #07070b;
    --ink: #e8e6e3;
    --dim: #55535c;
    --dim2: #3a3942;
    --accent: #e8e6e3;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'IBM Plex Mono', monospace;
    overflow: hidden;
    cursor: crosshair;
  }

/* 谱面轨道网格背景（可拖拽） */
  .grid {
    position: fixed; inset: -200px;
    background-image:
      linear-gradient(rgba(232,230,227,.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(232,230,227,.05) 1px, transparent 1px);
    background-size: 44px 44px;
    transform: rotate(12deg);
    z-index: 0;
    will-change: transform;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    cursor: grab;
  }

  /* 噪点 */
  body::after {
    content: "";
    position: fixed; inset: 0;
    background-image: radial-gradient(rgba(232,230,227,.08) 1px, transparent 1px);
    background-size: 3px 3px;
    opacity: .25;
    pointer-events: none;
    z-index: 5;
  }

  main {
    position: relative; z-index: 1;
    height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 56px;
    padding: 24px;
  }

  /* 轨道核心：双层旋转环 + 名字 */
  .core-wrap { position: relative; width: 280px; height: 280px; }
  .ring {
    position: absolute; border-radius: 50%;
    top: 50%; left: 50%;
  }
  .r1 {
    width: 280px; height: 280px;
    margin: -140px 0 0 -140px;
    border: 1px dashed rgba(232,230,227,.28);
    animation: spin 32s linear infinite;
  }
  .r2 {
    width: 216px; height: 216px;
    margin: -108px 0 0 -108px;
    border: 1px solid rgba(232,230,227,.12);
    border-top-color: rgba(232,230,227,.6);
    animation: spin-rev 18s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes spin-rev { to { transform: rotate(-360deg); } }
  .core {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 2px;
  }
  .core h1 { font-size: 34px; font-weight: 500; letter-spacing: 6px; margin-right: -6px; }
  .core p { font-size: 12px; color: var(--dim); letter-spacing: 3px; }

  /* 节拍点链接列表 */
  .links { display: flex; flex-direction: column; gap: 2px; width: 360px; max-width: 100%; }
  .links a {
    display: flex; align-items: baseline; gap: 16px;
    padding: 9px 12px;
    text-decoration: none; color: var(--dim);
    font-size: 15px; letter-spacing: 1px;
    border-radius: 2px;
    transition: color .15s ease, background .15s ease;
    position: relative;
  }
  .links a::after {
    content: ""; position: absolute;
    left: 12px; right: 12px; bottom: 4px;
    height: 1px; background: var(--accent);
    transform: scaleX(0); transform-origin: left;
    transition: transform .2s ease;
  }
  .links a:hover { color: var(--ink); background: rgba(232,230,227,.045); }
  .links a:hover::after { transform: scaleX(1); }
  .links .no { font-size: 11px; color: var(--dim2); min-width: 20px; }
  .links .icon { width: 15px; height: 15px; fill: var(--dim2); flex-shrink: 0; align-self: center; transition: fill .15s ease, filter .15s ease; }
  .links .icon-img { width: 15px; height: 15px; flex-shrink: 0; align-self: center; filter: grayscale(1) brightness(.6); transition: filter .15s ease; }
  .links a:hover .icon-img { filter: grayscale(0) brightness(1); }
  .links a:hover .icon { fill: var(--ink); filter: drop-shadow(0 0 5px rgba(232,230,227,.45)); }
  .links .badge {
    width: 15px; height: 15px; flex-shrink: 0; align-self: center;
    display: inline-flex; align-items: center; justify-content: center;
    border: 1px solid var(--dim2); border-radius: 3px;
    font-size: 8px; letter-spacing: 0; color: var(--dim2);
    transition: color .15s ease, border-color .15s ease, filter .15s ease;
  }
  .links a:hover .badge { color: var(--ink); border-color: var(--ink); filter: drop-shadow(0 0 5px rgba(232,230,227,.45)); }
  .links .path { margin-left: auto; font-size: 11px; color: var(--dim2); }
  .links a:hover .path { color: var(--dim); }

  /* 座右铭打字机 */
  .motto { font-size: 13px; color: var(--dim); letter-spacing: 2px; height: 18px; }
  .motto .cursor { color: var(--ink); animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  footer {
    position: fixed; left: 0; right: 0; bottom: 0;
    display: flex; justify-content: space-between;
    padding: 10px 16px;
    font-size: 11px; color: var(--dim2);
    letter-spacing: 1px;
    z-index: 4;
  }

  /* 点击波纹 */
  .ripple {
    position: fixed; border-radius: 50%;
    border: 1px solid rgba(232,230,227,.35);
    pointer-events: none;
    animation: ripple .7s ease-out forwards;
    z-index: 6;
  }
  @keyframes ripple { from { width: 0; height: 0; opacity: 1; } to { width: 120px; height: 120px; opacity: 0; } }

  @media (max-width: 520px) {
    .core-wrap { width: 200px; height: 200px; }
    .r1 { width: 200px; height: 200px; margin: -100px 0 0 -100px; }
    .r2 { width: 152px; height: 152px; margin: -76px 0 0 -76px; }
    .core h1 { font-size: 26px; }
    main { gap: 40px; }
    footer { font-size: 9px; }
  }
</style>
</head>

<script>
  // 座右铭打字机
  const motto = "vanitas vanitatum omnia vanitas";
  const el = document.getElementById("mottoText");
  let i = 0;
  (function type() {
    if (i <= motto.length) {
      el.textContent = motto.slice(0, i++);
      setTimeout(type, 85);
    }
  })();

  // 点击波纹
  document.addEventListener("click", (e) => {
    const r = document.createElement("div");
    r.className = "ripple";
    r.style.left = e.clientX + "px";
    r.style.top = e.clientY + "px";
    document.body.appendChild(r);
    setTimeout(() => r.remove(), 750);
  });

  // 核心环视差跟随
  const wrap = document.getElementById("coreWrap");
  window.addEventListener("mousemove", (e) => {
    const x = (e.clientX / window.innerWidth - .5) * 10;
    const y = (e.clientY / window.innerHeight - .5) * 10;
    wrap.style.translate = x + "px " + y + "px";
  }, { passive: true });

  // 网格拖拽 + 惯性 + 空闲自动漂移
  (() => {
    const grid = document.querySelector(".grid");
    let posX = 0, posY = 0;          // 当前偏移
    let velX = 0, velY = 0;          // 速度
    let dragging = false;
    let lastX = 0, lastY = 0;
    let lastTime = 0;
    let animId = null;
    let idleTimer = null;

    // 网格循环周期（44px * sqrt(2) 约 62px，但用 44px 即可无缝）
    const GRID_SIZE = 44;

    function applyTransform() {
      // 无限循环：取模保证数值不溢出
      const modX = ((posX % GRID_SIZE) + GRID_SIZE) % GRID_SIZE;
      const modY = ((posY % GRID_SIZE) + GRID_SIZE) % GRID_SIZE;
      grid.style.transform = `rotate(12deg) translate(${modX}px, ${modY}px)`;
    }

    function animate() {
      // 惯性衰减
      velX *= 0.95;
      velY *= 0.95;
      posX += velX;
      posY += velY;
      applyTransform();

      if (Math.abs(velX) > 0.05 || Math.abs(velY) > 0.05) {
        animId = requestAnimationFrame(animate);
      } else {
        animId = null;
        startIdleDrift();
      }
    }

    function startIdleDrift() {
      clearTimeout(idleTimer);
      idleTimer = setTimeout(() => {
        // 空闲 3 秒后启动缓慢自动漂移
        velX = (Math.random() - 0.5) * 0.3;
        velY = (Math.random() - 0.5) * 0.3;
        if (!animId) animate();
      }, 3000);
    }

    function stopIdleDrift() {
      clearTimeout(idleTimer);
    }

    function onDown(clientX, clientY) {
      dragging = true;
      stopIdleDrift();
      cancelAnimationFrame(animId);
      animId = null;
      lastX = clientX;
      lastY = clientY;
      lastTime = performance.now();
      velX = 0;
      velY = 0;
      grid.style.cursor = "grabbing";
      document.body.style.userSelect = "none";
    }

    function onMove(clientX, clientY) {
      if (!dragging) return;
      const now = performance.now();
      const dt = now - lastTime;
      if (dt > 0) {
        // 计算即时速度用于惯性
        velX = (clientX - lastX) / dt * 16;  // 归一化到 60fps
        velY = (clientY - lastY) / dt * 16;
      }
      posX += clientX - lastX;
      posY += clientY - lastY;
      lastX = clientX;
      lastY = clientY;
      lastTime = now;
      applyTransform();
    }

    function onUp() {
      if (!dragging) return;
      dragging = false;
      grid.style.cursor = "grab";
      document.body.style.userSelect = "";
      // 启动惯性动画
      if (!animId) animate();
    }

    // 鼠标事件
    grid.addEventListener("mousedown", e => onDown(e.clientX, e.clientY));
    window.addEventListener("mousemove", e => onMove(e.clientX, e.clientY));
    window.addEventListener("mouseup", onUp);
    window.addEventListener("mouseleave", onUp);

    // 触摸事件
    grid.addEventListener("touchstart", e => {
      const t = e.touches[0];
      onDown(t.clientX, t.clientY);
    }, { passive: true });
    window.addEventListener("touchmove", e => {
      const t = e.touches[0];
      onMove(t.clientX, t.clientY);
    }, { passive: true });
    window.addEventListener("touchend", onUp);
    window.addEventListener("touchcancel", onUp);

    // 初始状态
    grid.style.cursor = "grab";
    applyTransform();
    startIdleDrift();
  })();
</script>
